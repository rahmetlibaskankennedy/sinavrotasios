workflows:
  ios-simulator:
    name: SınavRotası iOS Simulator
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      node: 22

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Install Capacitor iOS
        script: |
          npm install @capacitor/ios@8.5.0

      - name: Add iOS platform
        script: |
          npx cap add ios

      - name: Configure iOS deep link
        script: |
          PLIST_PATH="$CM_BUILD_DIR/ios/App/App/Info.plist"

          echo "Configuring iOS URL scheme..."
          echo "Info.plist: $PLIST_PATH"

          if [ ! -f "$PLIST_PATH" ]; then
            echo "ERROR: Info.plist not found."
            exit 1
          fi

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleURLTypes" \
            "$PLIST_PATH" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes array" \
            "$PLIST_PATH"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes:0 dict" \
            "$PLIST_PATH"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes:0:CFBundleTypeRole string Editor" \
            "$PLIST_PATH"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.sinavrotasi.mebgys" \
            "$PLIST_PATH"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" \
            "$PLIST_PATH"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string sinavrotasi" \
            "$PLIST_PATH"

          echo "Deep link configuration added."

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleURLTypes" \
            "$PLIST_PATH"

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Verify deep link after sync
        script: |
          PLIST_PATH="$CM_BUILD_DIR/ios/App/App/Info.plist"

          echo "Verifying URL scheme after Capacitor sync..."

          SCHEME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes:0" \
              "$PLIST_PATH"
          )

          echo "Detected scheme: $SCHEME"

          if [ "$SCHEME" != "sinavrotasi" ]; then
            echo "ERROR: sinavrotasi URL scheme is missing."
            exit 1
          fi

          echo "SUCCESS: iOS deep link scheme is configured."

      - name: Show Xcode project
        script: |
          echo "Xcode project files:"

          find ios -maxdepth 4 -type d \
            \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) \
            -print

      - name: Build unsigned iOS Simulator app
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Find available iPhone Simulator
        script: |
          echo "Available simulators:"
          xcrun simctl list devices available

          DEVICE_ID=$(xcrun simctl list devices available \
            | grep "iPhone" \
            | head -1 \
            | grep -oE '[0-9A-F-]{36}')

          if [ -z "$DEVICE_ID" ]; then
            echo "ERROR: No available iPhone Simulator found."
            exit 1
          fi

          echo "Selected Simulator: $DEVICE_ID"
          echo "$DEVICE_ID" > /tmp/simulator_id

      - name: Boot iOS Simulator
        script: |
          DEVICE_ID=$(cat /tmp/simulator_id)

          echo "Booting simulator:"
          echo "$DEVICE_ID"

          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

          echo "Simulator boot completed."

      - name: Verify generated app
        script: |
          APP_PATH="$CM_BUILD_DIR/build/ios/Build/Products/Debug-iphonesimulator/App.app"

          echo "Checking generated application:"
          echo "$APP_PATH"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App.app was not generated."

            find "$CM_BUILD_DIR/build/ios" \
              -maxdepth 7 \
              -name "*.app" \
              -print || true

            exit 1
          fi

          echo "App.app found successfully."

      - name: Verify built Info.plist
        script: |
          APP_PLIST="$CM_BUILD_DIR/build/ios/Build/Products/Debug-iphonesimulator/App.app/Info.plist"

          echo "Checking built application Info.plist..."

          if [ ! -f "$APP_PLIST" ]; then
            echo "ERROR: Built Info.plist not found."
            exit 1
          fi

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP_PLIST"

          SCHEME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes:0" \
              "$APP_PLIST"
          )

          echo "Built app URL scheme: $SCHEME"

          if [ "$SCHEME" != "sinavrotasi" ]; then
            echo "ERROR: Built application does not contain sinavrotasi URL scheme."
            exit 1
          fi

          echo "SUCCESS: Built application contains the deep link scheme."

      - name: Install app on Simulator
        script: |
          DEVICE_ID=$(cat /tmp/simulator_id)

          APP_PATH="$CM_BUILD_DIR/build/ios/Build/Products/Debug-iphonesimulator/App.app"

          echo "Installing SınavRotası..."
          echo "Simulator: $DEVICE_ID"
          echo "Application: $APP_PATH"

          xcrun simctl install "$DEVICE_ID" "$APP_PATH"

          echo "Installation completed successfully."

      - name: Launch SınavRotası
        script: |
          DEVICE_ID=$(cat /tmp/simulator_id)

          BUNDLE_ID="com.sinavrotasi.mebgys"

          echo "Launching:"
          echo "$BUNDLE_ID"

          LAUNCH_RESULT=$(xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID")

          echo "$LAUNCH_RESULT"

          if echo "$LAUNCH_RESULT" | grep -q "$BUNDLE_ID"; then
            echo "Application launch command succeeded."
          else
            echo "Launch command returned:"
            echo "$LAUNCH_RESULT"
          fi

      - name: Wait for application startup
        script: |
          echo "Waiting 10 seconds for SınavRotası to load..."
          sleep 10
          echo "Startup wait completed."

      - name: Test iOS deep link
        script: |
          DEVICE_ID=$(cat /tmp/simulator_id)

          DEEP_LINK="sinavrotasi://auth-callback"

          echo "Testing deep link:"
          echo "$DEEP_LINK"

          xcrun simctl openurl "$DEVICE_ID" "$DEEP_LINK"

          echo "Deep link command completed."

          sleep 5

      - name: Verify application after deep link
        script: |
          DEVICE_ID=$(cat /tmp/simulator_id)

          BUNDLE_ID="com.sinavrotasi.mebgys"

          echo "Checking application after deep-link invocation..."

          APP_INFO=$(xcrun simctl listapps "$DEVICE_ID")

          if echo "$APP_INFO" | grep -q "$BUNDLE_ID"; then
            echo "SUCCESS: SınavRotası remains installed after deep-link test."
          else
            echo "ERROR: SınavRotası could not be found after deep-link test."
            exit 1
          fi

      - name: Capture iOS screenshot
        script: |
          DEVICE_ID=$(cat /tmp/simulator_id)

          SCREENSHOT_DIR="$CM_BUILD_DIR/build/screenshots"
          SCREENSHOT_PATH="$SCREENSHOT_DIR/sinavrotasi-ios-deeplink.png"

          echo "Creating screenshot directory:"
          echo "$SCREENSHOT_DIR"

          mkdir -p "$SCREENSHOT_DIR"

          echo "Capturing iOS Simulator screenshot..."

          xcrun simctl io "$DEVICE_ID" screenshot "$SCREENSHOT_PATH"

          if [ ! -f "$SCREENSHOT_PATH" ]; then
            echo "ERROR: Screenshot was not created."
            exit 1
          fi

          echo "SUCCESS: Screenshot created:"
          ls -lh "$SCREENSHOT_PATH"

      - name: Show installed application details
        script: |
          DEVICE_ID=$(cat /tmp/simulator_id)

          BUNDLE_ID="com.sinavrotasi.mebgys"

          echo "Installed application details:"

          xcrun simctl listapps "$DEVICE_ID" \
            | grep -A 15 -B 3 "$BUNDLE_ID" \
            || true

      - name: Shutdown Simulator
        script: |
          DEVICE_ID=$(cat /tmp/simulator_id)

          echo "Shutting down simulator..."

          xcrun simctl shutdown "$DEVICE_ID" || true

          echo "Simulator shutdown completed."

    artifacts:
      - build/ios/Build/Products/Debug-iphonesimulator/*.app
      - build/ios/Build/Products/Debug-iphonesimulator/**/*.app
      - build/screenshots/*.png

workflows:
  ios-simulator:
    name: SınavRotası iOS Simulator Smoke Test
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      node: 22

    scripts:
      - name: Install dependencies
        script: |
          set -euo pipefail

          npm ci

      - name: Install Capacitor iOS
        script: |
          set -euo pipefail

          npm install @capacitor/ios@8.5.0

      - name: Add iOS platform
        script: |
          set -euo pipefail

          npx cap add ios

      - name: Configure iOS deep link
        script: |
          set -euo pipefail

          PLIST_PATH="$CM_BUILD_DIR/ios/App/App/Info.plist"

          echo "Configuring iOS URL scheme..."
          echo "Info.plist: $PLIST_PATH"

          if [ ! -f "$PLIST_PATH" ]; then
            echo "ERROR: Info.plist not found."
            exit 1
          fi

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleURLTypes" \
            "$PLIST_PATH" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes array" \
            "$PLIST_PATH"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes:0 dict" \
            "$PLIST_PATH"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes:0:CFBundleTypeRole string Editor" \
            "$PLIST_PATH"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.sinavrotasi.mebgys" \
            "$PLIST_PATH"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" \
            "$PLIST_PATH"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string sinavrotasi" \
            "$PLIST_PATH"

          echo "Deep link configuration added."

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleURLTypes" \
            "$PLIST_PATH"

      - name: Sync Capacitor
        script: |
          set -euo pipefail

          npx cap sync ios

      - name: Verify deep link after sync
        script: |
          set -euo pipefail

          PLIST_PATH="$CM_BUILD_DIR/ios/App/App/Info.plist"

          echo "Verifying URL scheme after Capacitor sync..."

          SCHEME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes:0" \
              "$PLIST_PATH"
          )

          echo "Detected scheme: $SCHEME"

          if [ "$SCHEME" != "sinavrotasi" ]; then
            echo "ERROR: sinavrotasi URL scheme is missing."
            exit 1
          fi

          echo "SUCCESS: iOS deep link scheme is configured."

      - name: Show Xcode project
        script: |
          set -euo pipefail

          echo "Xcode project files:"

          find ios -maxdepth 4 -type d \
            \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) \
            -print

      - name: Build unsigned iOS Simulator app
        script: |
          set -euo pipefail

          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Find available iPhone Simulator
        script: |
          set -euo pipefail

          echo "Available simulators:"
          xcrun simctl list devices available

          DEVICE_ID=$(
            xcrun simctl list devices available \
              | grep "iPhone" \
              | head -1 \
              | grep -oE '[0-9A-F-]{36}'
          )

          if [ -z "$DEVICE_ID" ]; then
            echo "ERROR: No available iPhone Simulator found."
            exit 1
          fi

          echo "Selected Simulator: $DEVICE_ID"
          echo "$DEVICE_ID" > /tmp/simulator_id

      - name: Boot iOS Simulator
        script: |
          set -euo pipefail

          DEVICE_ID=$(cat /tmp/simulator_id)

          echo "Booting simulator:"
          echo "$DEVICE_ID"

          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

          echo "Simulator boot completed."

      - name: Verify generated app
        script: |
          set -euo pipefail

          APP_PATH="$CM_BUILD_DIR/build/ios/Build/Products/Debug-iphonesimulator/App.app"

          echo "Checking generated application:"
          echo "$APP_PATH"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App.app was not generated."

            find "$CM_BUILD_DIR/build/ios" \
              -maxdepth 7 \
              -name "*.app" \
              -print || true

            exit 1
          fi

          echo "SUCCESS: App.app found."

      - name: Verify built Info.plist
        script: |
          set -euo pipefail

          APP_PLIST="$CM_BUILD_DIR/build/ios/Build/Products/Debug-iphonesimulator/App.app/Info.plist"

          if [ ! -f "$APP_PLIST" ]; then
            echo "ERROR: Built Info.plist not found."
            exit 1
          fi

          BUNDLE_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$APP_PLIST"
          )

          SCHEME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes:0" \
              "$APP_PLIST"
          )

          echo "Bundle ID: $BUNDLE_ID"
          echo "URL scheme: $SCHEME"

          if [ "$BUNDLE_ID" != "com.sinavrotasi.mebgys" ]; then
            echo "ERROR: Unexpected bundle ID."
            exit 1
          fi

          if [ "$SCHEME" != "sinavrotasi" ]; then
            echo "ERROR: Built application does not contain sinavrotasi URL scheme."
            exit 1
          fi

          echo "SUCCESS: Built application configuration verified."

      - name: Install app on Simulator
        script: |
          set -euo pipefail

          DEVICE_ID=$(cat /tmp/simulator_id)
          APP_PATH="$CM_BUILD_DIR/build/ios/Build/Products/Debug-iphonesimulator/App.app"

          echo "Installing SınavRotası..."

          xcrun simctl install "$DEVICE_ID" "$APP_PATH"

          echo "SUCCESS: Installation completed."

      - name: Clear previous crash logs
        script: |
          set -euo pipefail

          mkdir -p "$CM_BUILD_DIR/build/crashlogs"

          rm -f "$CM_BUILD_DIR/build/crashlogs/"* || true

          echo "Crash log output directory prepared."

      - name: Launch SınavRotası
        script: |
          set -euo pipefail

          DEVICE_ID=$(cat /tmp/simulator_id)
          BUNDLE_ID="com.sinavrotasi.mebgys"

          echo "Launching $BUNDLE_ID..."

          if ! LAUNCH_RESULT=$(xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID" 2>&1); then
            echo "ERROR: Application launch command failed."
            echo "$LAUNCH_RESULT"
            exit 1
          fi

          echo "$LAUNCH_RESULT"

          if ! echo "$LAUNCH_RESULT" | grep -q "$BUNDLE_ID"; then
            echo "ERROR: Launch output does not contain expected bundle ID."
            exit 1
          fi

          echo "SUCCESS: Application launch command succeeded."

      - name: Verify process after launch
        script: |
          set -euo pipefail

          DEVICE_ID=$(cat /tmp/simulator_id)
          BUNDLE_ID="com.sinavrotasi.mebgys"

          echo "Waiting for application startup..."
          sleep 8

          echo "Checking running process..."

          if ! xcrun simctl spawn "$DEVICE_ID" launchctl list \
            | grep -q "$BUNDLE_ID"; then
            echo "ERROR: SınavRotası process is not running after launch."
            exit 1
          fi

          echo "SUCCESS: SınavRotası process is running."

      - name: Test iOS deep link
        script: |
          set -euo pipefail

          DEVICE_ID=$(cat /tmp/simulator_id)
          DEEP_LINK="sinavrotasi://auth-callback"

          echo "Testing deep link:"
          echo "$DEEP_LINK"

          if ! xcrun simctl openurl "$DEVICE_ID" "$DEEP_LINK"; then
            echo "ERROR: Deep-link open command failed."
            exit 1
          fi

          echo "Deep-link command accepted."
          sleep 5

      - name: Verify process after deep link
        script: |
          set -euo pipefail

          DEVICE_ID=$(cat /tmp/simulator_id)
          BUNDLE_ID="com.sinavrotasi.mebgys"

          echo "Checking process after deep link..."

          if ! xcrun simctl spawn "$DEVICE_ID" launchctl list \
            | grep -q "$BUNDLE_ID"; then
            echo "ERROR: SınavRotası is not running after deep-link invocation."
            exit 1
          fi

          echo "SUCCESS: Application process is still running after deep link."

      - name: Collect simulator crash logs
        script: |
          set -euo pipefail

          DEVICE_ID=$(cat /tmp/simulator_id)
          CRASH_DIR="$CM_BUILD_DIR/build/crashlogs"

          mkdir -p "$CRASH_DIR"

          echo "Checking diagnostic logs..."

          DEVICE_DATA=$(
            xcrun simctl get_app_container \
              "$DEVICE_ID" \
              com.sinavrotasi.mebgys \
              data 2>/dev/null || true
          )

          echo "App data container:"
          echo "${DEVICE_DATA:-not available}"

          SIM_DEVICE_DIR="$HOME/Library/Developer/CoreSimulator/Devices/$DEVICE_ID"

          if [ -d "$SIM_DEVICE_DIR" ]; then
            find "$SIM_DEVICE_DIR" \
              \( -name "*.crash" -o -name "*.ips" \) \
              -type f \
              -mmin -10 \
              -exec cp {} "$CRASH_DIR/" \; \
              2>/dev/null || true
          fi

          echo "Collected crash logs:"
          find "$CRASH_DIR" -maxdepth 1 -type f -print || true

      - name: Fail if recent app crash detected
        script: |
          set -euo pipefail

          CRASH_DIR="$CM_BUILD_DIR/build/crashlogs"

          MATCH_FOUND=0

          if [ -d "$CRASH_DIR" ]; then
            while IFS= read -r FILE; do
              if grep -Eiq \
                "com\.sinavrotasi\.mebgys|SınavRotası|SinavRotasi" \
                "$FILE" 2>/dev/null; then

                echo "ERROR: Possible SınavRotası crash detected:"
                echo "$FILE"

                MATCH_FOUND=1
              fi
            done < <(
              find "$CRASH_DIR" \
                -maxdepth 1 \
                -type f \
                \( -name "*.crash" -o -name "*.ips" \)
            )
          fi

          if [ "$MATCH_FOUND" -eq 1 ]; then
            exit 1
          fi

          echo "SUCCESS: No matching recent crash log detected."

      - name: Capture iOS screenshot
        script: |
          set -euo pipefail

          DEVICE_ID=$(cat /tmp/simulator_id)

          SCREENSHOT_DIR="$CM_BUILD_DIR/build/screenshots"
          SCREENSHOT_PATH="$SCREENSHOT_DIR/sinavrotasi-ios-deeplink.png"

          mkdir -p "$SCREENSHOT_DIR"

          echo "Capturing iOS Simulator screenshot..."

          xcrun simctl io \
            "$DEVICE_ID" \
            screenshot \
            "$SCREENSHOT_PATH"

          if [ ! -f "$SCREENSHOT_PATH" ]; then
            echo "ERROR: Screenshot was not created."
            exit 1
          fi

          echo "SUCCESS: Screenshot created."
          ls -lh "$SCREENSHOT_PATH"

      - name: Final simulator verification
        script: |
          set -euo pipefail

          DEVICE_ID=$(cat /tmp/simulator_id)
          BUNDLE_ID="com.sinavrotasi.mebgys"

          echo "Final process verification..."

          if ! xcrun simctl spawn "$DEVICE_ID" launchctl list \
            | grep -q "$BUNDLE_ID"; then
            echo "ERROR: Application is no longer running."
            exit 1
          fi

          echo "SUCCESS: Simulator smoke test completed."

      - name: Shutdown Simulator
        script: |
          DEVICE_ID=$(cat /tmp/simulator_id)

          echo "Shutting down simulator..."

          xcrun simctl shutdown "$DEVICE_ID" || true

          echo "Simulator shutdown completed."

    artifacts:
      - build/ios/Build/Products/Debug-iphonesimulator/*.app
      - build/ios/Build/Products/Debug-iphonesimulator/**/*.app
      - build/screenshots/*.png
      - build/crashlogs/*.crash
      - build/crashlogs/*.ips

apply plugin: 'com.android.application'

def releaseKeystoreProperties = new Properties()
def releaseKeystorePropertiesFile = rootProject.file('keystore.properties')
if (releaseKeystorePropertiesFile.exists()) {
    releaseKeystorePropertiesFile.withInputStream { releaseKeystoreProperties.load(it) }
}
def releaseStoreFile = System.getenv('SINAVROTASI_STORE_FILE') ?: releaseKeystoreProperties.getProperty('storeFile')
def releaseStorePassword = System.getenv('SINAVROTASI_STORE_PASSWORD') ?: releaseKeystoreProperties.getProperty('storePassword')
def releaseKeyAlias = System.getenv('SINAVROTASI_KEY_ALIAS') ?: releaseKeystoreProperties.getProperty('keyAlias')
def releaseKeyPassword = System.getenv('SINAVROTASI_KEY_PASSWORD') ?: releaseKeystoreProperties.getProperty('keyPassword')
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }

android {
    namespace = "com.sinavrotasi.mebgys"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.sinavrotasi.mebgys"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 16
        versionName "1.16.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

if (!hasReleaseSigning) {
    logger.warn('Release AAB unsigned üretilecektir. İmzalı paket için android/keystore.properties veya SINAVROTASI_* ortam değişkenlerini ayarlayın.')
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // Play Billing: AIDL değil, modern kütüphane. Google 31 Ağu 2026'dan
    // itibaren v8+ zorunlu tutuyor (Play Console uyarısı bu yüzden çıktı).
    implementation "com.android.billingclient:billing:8.1.0"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
